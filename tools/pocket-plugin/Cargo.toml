[package]
name = "playstation-game-files"
version = "0.1.4"
edition = "2021"
license = "MIT"
description = "Pocket Sync / pupdate plugin: game files for the PlayStation core"
publish = false

[lib]
name = "plugin"
crate-type = ["cdylib", "rlib"]

[dependencies]
extism-pdk = "1.3"
serde = { version = "1", features = ["derive"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
serde_json = "1"
chd = { version = "0.4", default-features = false, features = ["std"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
